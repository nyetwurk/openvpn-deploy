# Ban tls-crypt probes and failed TLS/cert handshakes.
# `sudo make deploy` copies this when /etc/fail2ban/jail.d exists.
#
# No port= (inherits 0:65535). protocol covers UDP and TCP so the
# ban does not follow UDP_PORT / TCP_PORT.
# A client with a stale or wrong .ovpn logs the same lines; put your
# own addresses in ignoreip (jail.d, not this file).

[openvpn-tls-crypt]
enabled = true
backend = systemd
filter = openvpn-tls-crypt
protocol = udp,tcp
maxretry = 3
findtime = 2h
bantime = 4h
usedns = raw

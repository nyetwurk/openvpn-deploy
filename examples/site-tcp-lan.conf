# NAT router that already masquerades a LAN. UDP stays on.
# TCP on 443 is the fallback, behind an external mux (HAProxy).
# Clients get a full tunnel plus the LAN route and DNS below.
# Copy onto site.conf and edit the names and subnet.
# server/openvpn.nft flushes inet filter forward. This file sets
# NFT_MODE=nat so make deploy copies server/openvpn-nat.nft, which
# fills the parent's openvpn jump chains and leaves forward alone.

# Hostname clients dial. Also the server certificate name unless
# SERVER_CN is set.
REMOTE = vpn.my-router.com

# Pushed to clients (address then netmask). A wrong subnet can
# steal a client's home or office LAN.
LAN_ROUTE = 192.168.1.0 255.255.255.0

# Pushed resolver. Also blocks Windows from using other resolvers.
DNS = 192.168.1.1

# Builds the TCP listener and .tcp.ovpn. UDP remains the tunnel
# to use when it is not blocked.
ENABLE_TCP = yes

# Public port clients dial. Default is 443.
#TCP_PORT = 443

# Native mux: OpenVPN listens on TCP_PORT and sends other TCP to
# this HTTPS daemon (Apache). The daemon must not listen on
# TCP_PORT. Mutually exclusive with TCP_LISTEN.
#PORT_SHARE = 127.0.0.1 8443

# External mux: HAProxy owns TCP_PORT. OpenVPN binds here.
# Clients still dial TCP_PORT. Pair with examples/haproxy-local.cfg.
# Mutually exclusive with PORT_SHARE.
TCP_LISTEN = 127.0.0.1 1194

# nat requires NFT_DEST. make deploy copies server/openvpn-nat.nft
# here (0755). Does not nft -f.
NFT_MODE = nat
NFT_DEST = /etc/nftables.d/50-openvpn.nft

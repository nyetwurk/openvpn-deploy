# Ban tls-crypt probes and failed TLS/cert handshakes.
# Debian openvpn-server@ logs to journald (no --daemon prefix).
# `sudo make deploy` copies this when /etc/fail2ban/filter.d exists.

[INCLUDES]

before = common.conf

[Definition]

logtype = journal
_daemon = openvpn
# UDP: "1.2.3.4:port …" or "udp4:1.2.3.4:port …". TCP: "tcp4-server:…".
__ovpn_peer = (?:(?:tcp[46]-server|udp[46]):)?

# "tls-crypt unwrap error: packet too short" has no address. The
# following line does. The listener is IPv4 ([AF_INET]); AF_INET6 is
# listed in case that changes. Do not match Connection reset
# (real clients disconnect that way).
failregex = ^%(__prefix_line)s(?:tcp[46]-server:\S+\s+)?TLS Error: tls-crypt unwrapping failed from \[AF_INET6?\]<ADDR>:\d+\s*$
            ^%(__prefix_line)s%(__ovpn_peer)s<ADDR>:\d+\s+TLS Error: TLS handshake failed\s*$
            ^%(__prefix_line)s%(__ovpn_peer)s<ADDR>:\d+\s+VERIFY ERROR:

ignoreregex =

journalmatch = SYSLOG_IDENTIFIER=openvpn

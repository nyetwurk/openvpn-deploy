# NTL
# Live TCP unit (openvpn-server@server-tcp). Annotated sample: server.conf
# Hotel/guest-wifi fallback. Apache must not Listen 443.
# TUN. 10.8.20.0/24 (UDP uses 10.8.19.0/24).

port 443
port-share 127.0.0.1 8443 # forward HTTPS traffic to Apache on 8443
proto tcp
dev tun1
topology subnet

ca easy-rsa/pki/ca.crt
cert easy-rsa/pki/issued/vpn.internal.curtisfong.org.crt
key easy-rsa/pki/private/vpn.internal.curtisfong.org.key
dh easy-rsa/pki/dh.pem
tls-auth server/ta.key 0

server 10.8.20.0 255.255.255.0
ifconfig-pool-persist /var/log/openvpn/ipp-tcp.txt

push "redirect-gateway def1 bypass-dhcp"
push "route 192.168.19.0 255.255.255.0"
push "dhcp-option DNS 192.168.19.1"

keepalive 10 120
data-ciphers AES-256-CBC
cipher AES-256-CBC
# phones: fragment is UDP-only
mssfix 1360

user nobody
group nogroup
persist-key
persist-tun

status /var/log/openvpn/openvpn-tcp-status.log
log /var/log/openvpn/openvpn-tcp.log
verb 3

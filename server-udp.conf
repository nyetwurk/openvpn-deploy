# NTL
# Live UDP unit (openvpn-server@server-udp). Annotated sample: server.conf
# TUN for Android/iOS. 10.8.19.0/24 not 10.8.0.0/24 (other VPN).

port 1194
proto udp
dev tun0
topology subnet

ca easy-rsa/pki/ca.crt
cert easy-rsa/pki/issued/vpn.internal.curtisfong.org.crt
key easy-rsa/pki/private/vpn.internal.curtisfong.org.key
dh easy-rsa/pki/dh.pem
tls-auth server/ta.key 0

server 10.8.19.0 255.255.255.0
ifconfig-pool-persist /var/log/openvpn/ipp.txt

push "redirect-gateway def1 bypass-dhcp"
push "route 192.168.19.0 255.255.255.0"
push "dhcp-option DNS 192.168.19.1"

keepalive 10 120
data-ciphers AES-256-CBC
cipher AES-256-CBC
# clamp inner TCP MSS; do not use fragment (Android FRAG_IN errors)
mssfix 1360

user nobody
group nogroup
persist-key
persist-tun

status /var/log/openvpn/openvpn-status.log
log /var/log/openvpn/openvpn.log
verb 3
explicit-exit-notify 1

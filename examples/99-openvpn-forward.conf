# Enable forwarding for OpenVPN TUN clients (WAN-only VPS).
# Not installed by `make deploy`. Copy to /etc/sysctl.d/ and run:
#   sysctl -p /etc/sysctl.d/99-openvpn-forward.conf
# Skip on the NAT router if LAN masquerade already has forwarding on.
# IPv6 forwarding for the tun prefix (default ENABLE_IPV6=yes).
# forwarding=1 ignores RA unless accept_ra=2 (SLAAC WAN default route).

net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv6.conf.all.accept_ra = 2
net.ipv6.conf.default.accept_ra = 2

# Catalog of site.conf options. Defaults live in gen-config.py.
# A missing site.conf is created with only REMOTE from hostname -f;
# make then stops so you can edit before the next run.
# Copy individual options into that file. Do not cp this catalog over
# site.conf (every line here is commented; you would lose REMOTE).
# Do not use Makefile syntax (?=, :=, $(...)).

# Client remote; defaults to hostname -f if omitted. example.com is
# rejected. Changing this after `make pki` needs a new server cert
# unless SERVER_CN is set separately.
#REMOTE = vpn.example.com

# Server cert CN and verify-x509-name. Defaults to REMOTE.
#SERVER_CN = vpn.internal.example.com

# A WAN-only host uses server/openvpn.nft. make deploy copies it
# when NFT_DEST is set (NFT_MODE defaults to vps). Otherwise copy it
# to /etc/nftables.d/openvpn.nft yourself.
# Do not install that fragment on a NAT router that already has
# forward/NAT rules. Use server/openvpn-nat.nft (NFT_MODE=nat).
# It fills jump chains; it does not flush forward.
# Empty UDP_POOL6 / TCP_POOL6 carve a /112 from the GUA on this if.
#WAN_IF = eth0

# Listeners. Anything other than yes skips that unit, its conf, and
# its client profiles. Stop leftover units on the host yourself.
#ENABLE_UDP = yes
#ENABLE_TCP = no

#UDP_PORT = 1194
#TCP_PORT = 443
#UDP_DEV = tun0
#TCP_DEV = tun1

# OpenVPN server / push route form: address then netmask.
#UDP_POOL = 10.8.19.0 255.255.255.0
#TCP_POOL = 10.8.20.0 255.255.255.0

# Dual-stack inside the tun (IPv4 listener unchanged). Default yes.
# Needs a public IPv6 on WAN_IF (NAT66, not a routed /64).
# no writes block-ipv6. Empty pools carve a /112 from that GUA
# (19/20, same numbers as the v4 pools). Set a CIDR /112 only to
# override. ULA sources lose to IPv4 (RFC 6724).
#ENABLE_IPV6 = no
#UDP_POOL6 = fd42:42:42:19::/112
#TCP_POOL6 = fd42:42:42:20::/112

# Empty = do not push. Wrong LAN_ROUTE can steal a client's local subnet.
#LAN_ROUTE = 192.168.1.0 255.255.255.0
# Empty = clients keep their resolver. Full tunnel still works.
# When set, also push block-outside-dns (Windows leak).
#DNS = 192.168.1.1

# Pool persist. Daemon-written; not /etc and not /var/log.
# Deploy creates the dir/files 0750/0640 nobody:adm if missing.
# Omitted when DUPLICATE_CN=yes (same CN would fight over one IP).
#STATE_DIR = /var/lib/openvpn-server
#UDP_IPP = /var/lib/openvpn-server/ipp.txt
#TCP_IPP = /var/lib/openvpn-server/ipp-tcp.txt

# Same client cert on several devices at once. yes also omits pool
# persist. Default no: one live session per CN. Prefer extra names
# in CLIENTS unless you really want to share one .ovpn.
#DUPLICATE_CN = no

#MSSFIX = 1360

# Full-tunnel push. Empty = split tunnel (LAN_ROUTE only).
#REDIRECT_GATEWAY = redirect-gateway def1 bypass-dhcp

# TCP only: OpenVPN muxes TCP_PORT toward this HTTPS daemon
# (address port). Empty = off. Mutually exclusive with TCP_LISTEN.
# Apache must not Listen on TCP_PORT when this is set.
#PORT_SHARE = 127.0.0.1 8443

# TCP only: OpenVPN listens here (address port) when another mux
# owns TCP_PORT. Clients still dial TCP_PORT. Mutually exclusive
# with PORT_SHARE. HAProxy example: examples/haproxy-local.cfg
#TCP_LISTEN = 127.0.0.1 1194

# Who gets a client profile. Space-separated. Defaults to your login.
#CLIENTS = alice bob

# After make, put client/*.ovpn into local bootstash when the CLI is
# on PATH, /usr/sbin, or /usr/local/sbin. auto is the default. no skips.
#BOOTSTASH = auto

# Deploy copies one generated fragment to this absolute path.
# NFT_MODE defaults to vps (server/openvpn.nft). Empty NFT_DEST
# skips the copy. nat (server/openvpn-nat.nft) requires NFT_DEST.
# Does not nft -f. Does not install sysctl. make dryrun diffs the
# destination against the fragment.
#NFT_DEST = /etc/nftables.d/openvpn.nft
#NAT router instead (do not set both destinations):
#NFT_MODE = nat
#NFT_DEST = /etc/nftables.d/50-openvpn.nft

# WAN-only Debian VPS. No LAN to push.
# UDP stays on (ENABLE_UDP defaults to yes). TCP stays off.
# Clients get a full tunnel. Dual-stack on the tun is the default
# (ENABLE_IPV6=yes); set ENABLE_IPV6=no when the WAN is IPv4-only.
# Copy onto site.conf and set REMOTE to the name clients dial.
# NFT_MODE defaults to vps, so make deploy copies server/openvpn.nft
# to NFT_DEST. That fragment flushes inet filter forward. A NAT
# router that already has forward rules uses examples/site-tcp-lan.conf.

# Hostname clients dial. Also the server certificate name unless
# SERVER_CN is set. example.com is rejected.
REMOTE = vpn.my-vps.com

# Absolute path. make deploy copies server/openvpn.nft here (0755).
# Does not nft -f and does not install sysctl. make dryrun diffs
# this path against the fragment. Empty NFT_DEST skips the copy.
NFT_DEST = /etc/nftables.d/50-openvpn.nft
